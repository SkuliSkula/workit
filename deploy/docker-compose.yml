services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  workit-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workit}
      POSTGRES_USER: ${POSTGRES_USER:-workit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - workit-db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workit} -d ${POSTGRES_DB:-workit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API ─────────────────────────────────────────────────────────────────────
  workit-api:
    # Built and pushed by .github/workflows/deploy.yml; the server only pulls.
    # IMAGE_TAG is pinned to a commit SHA in .env by deploy/deploy.sh.
    image: ghcr.io/skuliskula/workit-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      workit-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__WorkitDb: "Host=workit-db;Port=5432;Database=${POSTGRES_DB:-workit};Username=${POSTGRES_USER:-workit};Password=${POSTGRES_PASSWORD}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__Issuer: Workit.Api
      Jwt__Audience: Workit.Apps
      AdminSeed__Email: ${ADMIN_EMAIL}
      AdminSeed__Password: ${ADMIN_PASSWORD}
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY}
      PostHog__ProjectApiKey: ${POSTHOG_API_KEY:-}
      Resend__ApiKey: ${RESEND_API_KEY}
      Resend__From: ${RESEND_FROM:-Workit <noreply@workit.is>}
      App__Url: ${APP_URL:-https://admin.workit.is}
      # Job attachments — Cloudflare R2 (S3-compatible). If unset, the API falls
      # back to on-disk storage in the container (not durable across redeploys).
      Storage__ServiceUrl: ${R2_SERVICE_URL:-}
      Storage__AccessKeyId: ${R2_ACCESS_KEY_ID:-}
      Storage__SecretAccessKey: ${R2_SECRET_ACCESS_KEY:-}
      Storage__BucketName: ${R2_BUCKET_NAME:-}
    volumes:
      # DataProtection keys — MUST persist across container recreation, otherwise
      # every redeploy rotates the key and breaks DB-encrypted credentials.
      - workit-api-keys:/app/keys
    networks:
      - internal
      - app

  # ── Owner App (Blazor Server) ───────────────────────────────────────────────
  workit-owner:
    image: ghcr.io/skuliskula/workit-owner:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - workit-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # Internal Docker DNS — avoids a public roundtrip for server→API calls
      ApiBaseUrl: "http://workit-api:8080/"
    networks:
      - app

  # ── Cloudflare Tunnel ───────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - app

networks:
  internal:
    internal: true   # DB-only — not reachable from cloudflared
  app:
    driver: bridge   # API + Owner app + cloudflared

volumes:
  workit-db-data:
  # Pre-created and pre-populated on the server to preserve the existing
  # DataProtection key. Declared external so Compose reuses it without the
  # "already exists" warning and never destroys it on `compose down -v`.
  workit-api-keys:
    external: true
    name: deploy_workit-api-keys
