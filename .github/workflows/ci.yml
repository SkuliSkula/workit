name: CI

# Every push to dev and every PR into dev or main. Deploys live in deploy.yml;
# this workflow only ever tells you whether the code is sound.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  # A new push to a branch makes the previous run's answer irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Workit.sln

      - name: Build
        run: dotnet build Workit.sln -c Release --no-restore

      - name: Test
        run: dotnet test Workit.Tests/Workit.Tests.csproj -c Release --no-build --verbosity normal
