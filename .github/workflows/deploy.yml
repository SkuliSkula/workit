name: Deploy to production

# Merging into main ships to api.workit.is and admin.workit.is.
on:
  push:
    branches: [main]
    # Documentation-only merges should not rebuild images and restart a live
    # API. No .md file is embedded into any build, so skipping them cannot
    # change what runs. A commit touching both markdown and code still
    # deploys — paths-ignore only skips when *every* changed file matches.
    #
    # If a deploy is ever skipped and you wanted one, run this workflow by
    # hand from the Actions tab (workflow_dispatch, below).
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  # Never let two deploys touch the server at once; queue instead of cancelling,
  # so an in-flight rollout is always allowed to finish.
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: skuliskula

jobs:
  # ── Gate: the tests decide whether anything ships ──────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Workit.sln
      - run: dotnet build Workit.sln -c Release --no-restore
      - run: dotnet test Workit.Tests/Workit.Tests.csproj -c Release --no-build

  # ── Build arm64 images and push them to GHCR ───────────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A framework-dependent publish emits portable IL, so an x86 runner
      # produces output that runs unchanged on the arm64 server. No RID, no
      # cross-compilation, no emulation.
      - name: Publish API
        run: dotnet publish Workit.Api/Workit.Api.csproj -c Release -o Workit.Api/publish

      - name: Publish Owner app
        run: dotnet publish Workit.OwnerApp/Workit.OwnerApp.csproj -c Release -o Workit.OwnerApp/publish

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both Dockerfiles only COPY the published output — no RUN steps — so
      # buildx can assemble a linux/arm64 image on an x86 runner without QEMU.
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Workit.Api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/workit-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/workit-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Owner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Workit.OwnerApp/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/workit-owner:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/workit-owner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Tell the server to pull and restart ────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Load the deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key — never StrictHostKeyChecking=no, which would accept
          # whatever answers on that address.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          # Short-lived, job-scoped, and read-only against the registry.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The key is pinned to deploy/deploy.sh on the server; the SHA below is
          # its only argument and the token goes over stdin, never argv.
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "${{ github.sha }}"

      - name: Scrub the key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
